<!-- TAB 2: CONSULTA DE COLABORADORES & GAP ANALYSIS (MATRIZ DE COLABORADORES) -->
        <div id="tab-colab" class="hidden space-y-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-5">
                
                <!-- Grupo Unificado: Filtro Organizacional + Cabeçalho + Ficha Resumo -->
                <div class="p-4 sm:p-5 bg-slate-50/80 rounded-2xl border border-slate-200 space-y-4">
                    
                    <!-- Cabeçalho e Seletores Principais -->
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-200/80 pb-4">
                        <div>
                            <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                                <i data-lucide="user-check" class="w-4 h-4 text-schmitt-blue"></i>
                                <span>Ficha Individual do Colaborador</span>
                            </h2>
                            <p class="text-xs text-slate-500 mt-0.5">Comparação do perfil real com a Função-Alvo (acima da atual) para cálculo de necessidades de formação.</p>
                        </div>

                        <!-- Seletores Principais -->
                        <div class="flex flex-wrap items-center gap-2.5 w-full md:w-auto">
                            <select id="colab-select" onchange="onColabSelectChange()" class="text-xs bg-white border border-slate-200 rounded-xl px-3 py-2.5 font-bold text-schmitt-blue shadow-sm focus:outline-none">
                                <!-- Populated dynamically -->
                            </select>
                            <select id="colab-cat-filter" onchange="renderColaboradorProfile()" class="text-xs bg-white border border-slate-200 rounded-xl px-3 py-2.5 font-medium text-slate-700 shadow-sm focus:outline-none">
                                <option value="">Todas as Categorias</option>
                            </select>
                        </div>
                    </div>

                    <!-- Filtro Organizacional / Equipa -->
                    <div class="space-y-2.5">
                        <h3 class="text-[11px] font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
                            <i data-lucide="sitemap" class="w-3.5 h-3.5 text-schmitt-blue"></i>
                            <span>Filtro Organizacional / Equipa</span>
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Estrutura de Topo</label>
                                <select id="colab-filter-topo" onchange="onColabTopoFilterChange()" class="w-full text-xs bg-white border border-slate-200 rounded-xl p-2.5 font-bold text-schmitt-blue focus:outline-none">
                                    <option value="ALL">Todas as Estruturas</option>
                                </select>
                            </div>
                            
                            <div id="container-colab-filter-delegacao">
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Delegação / Zona</label>
                                <select id="colab-filter-delegacao" onchange="onColabDelegacaoFilterChange()" class="w-full text-xs bg-white border border-slate-200 rounded-xl p-2.5 font-medium focus:outline-none">
                                    <option value="ALL">Todas as Delegações</option>
                                </select>
                            </div>

                            <div id="container-colab-filter-tipo">
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Tipo / Departamento</label>
                                <select id="colab-filter-tipo" onchange="onColabTipoFilterChange()" class="w-full text-xs bg-white border border-slate-200 rounded-xl p-2.5 font-medium focus:outline-none">
                                    <option value="ALL">Todos os Departamentos</option>
                                </select>
                            </div>

                            <div id="container-colab-filter-equipa">
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Equipa Nº</label>
                                <select id="colab-filter-equipa" onchange="onColabEquipaFilterChange()" class="w-full text-xs bg-white border border-slate-200 rounded-xl p-2.5 font-bold text-schmitt-blue focus:outline-none">
                                    <option value="ALL">Todas as Equipas</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Cartão de Resumo do Colaborador Selecionado -->
                    <div id="colab-info-card" class="p-4 rounded-xl bg-white border border-slate-200/90 shadow-sm flex flex-wrap justify-between items-center gap-4">
                        <!-- Populated dynamically -->
                    </div>
                </div>

                <!-- Tabela de Competências -->
                <div class="overflow-x-auto rounded-xl border border-slate-200 custom-scrollbar">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead class="bg-slate-100 text-slate-700 font-semibold border-b border-slate-200">
                            <tr>
                                <th class="p-3">Categoria</th>
                                <th class="p-3">Competência</th>
                                <th class="p-3 text-center">Próximo Nível</th>
                                <th class="p-3 text-center">Nível Atual</th>
                                <th class="p-3 text-center">Estado / GAP</th>
                                <th class="p-3">Plano de Ação Sugerido</th>
                            </tr>
                        </thead>
                        <tbody id="colab-skills-tbody" class="divide-y divide-slate-100 bg-white">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
